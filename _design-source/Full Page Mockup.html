<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Zentopia · Teljes oldal mockup</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Press+Start+2P&display=swap" rel="stylesheet" />

<style>
  html, body { margin: 0; padding: 0; min-height: 100%; background: #d9d6cd; font-family: "Space Grotesk", system-ui, sans-serif; }
  * { box-sizing: border-box; }
  button { font-family: inherit; }
  img { -webkit-user-drag: none; }

  .toolbar {
    position: fixed;
    top: 16px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 9999;
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 6px;
    background: rgba(15, 31, 26, 0.92);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 999px;
    backdrop-filter: blur(12px);
    box-shadow: 0 8px 32px rgba(0,0,0,0.25);
    font-family: "JetBrains Mono", monospace;
    font-size: 11px;
    letter-spacing: 0.04em;
  }
  .toolbar button {
    background: transparent;
    border: none;
    color: rgba(250,250,247,0.55);
    padding: 7px 14px;
    border-radius: 999px;
    cursor: pointer;
    font: inherit;
    transition: all 180ms;
  }
  .toolbar button[aria-pressed="true"] {
    background: #C8FF6B;
    color: #0F1F1A;
    font-weight: 700;
  }
  .toolbar .label {
    color: rgba(250,250,247,0.55);
    padding-left: 8px;
    padding-right: 4px;
  }
  .stage {
    margin: 0 auto;
    background: #FAFAF7;
    box-shadow: 0 20px 80px rgba(0,0,0,0.18);
    overflow: hidden;
  }
  .stage.mobile { width: 390px; border-radius: 20px; margin-top: 80px; margin-bottom: 80px; }
  .stage.desktop { width: 1440px; margin-top: 80px; margin-bottom: 80px; }

  @media (max-width: 1500px) {
    .stage.desktop { transform-origin: top center; }
  }
</style>
</head>
<body>
<div class="toolbar">
  <span class="label">// view</span>
  <button id="btn-mobile" aria-pressed="true">MOBILE · 390</button>
  <button id="btn-desktop" aria-pressed="false">DESKTOP · 1440</button>
</div>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="shared.jsx"></script>
<script type="text/babel" src="hero-v1.jsx"></script>
<script type="text/babel" src="hero-v2.jsx"></script>
<script type="text/babel" src="services.jsx"></script>
<script type="text/babel" src="problem.jsx"></script>
<script type="text/babel" src="process.jsx"></script>
<script type="text/babel" src="cases.jsx"></script>
<script type="text/babel" src="founder.jsx"></script>
<script type="text/babel" src="faq.jsx"></script>
<script type="text/babel" src="cta.jsx"></script>
<script type="text/babel" src="footer.jsx"></script>
<script type="text/babel" src="full-page.jsx"></script>

<script type="text/babel">
function App() {
  // viewport persists across reload via localStorage so the user keeps their last view
  const [vp, setVp] = React.useState(() => {
    try { return localStorage.getItem('zen-vp') || 'mobile'; } catch { return 'mobile'; }
  });
  React.useEffect(() => {
    try { localStorage.setItem('zen-vp', vp); } catch {}
    document.getElementById('btn-mobile').setAttribute('aria-pressed', String(vp === 'mobile'));
    document.getElementById('btn-desktop').setAttribute('aria-pressed', String(vp === 'desktop'));

    // For desktop viewport, scale to fit the browser width if needed (preview convenience).
    const stage = document.getElementById('stage-el');
    if (stage && vp === 'desktop') {
      const fit = () => {
        const avail = window.innerWidth - 48;
        const scale = avail < 1440 ? avail / 1440 : 1;
        stage.style.transform = scale < 1 ? `scale(${scale})` : '';
      };
      fit();
      window.addEventListener('resize', fit);
      return () => window.removeEventListener('resize', fit);
    } else if (stage) {
      stage.style.transform = '';
    }
  }, [vp]);

  React.useEffect(() => {
    const bm = document.getElementById('btn-mobile');
    const bd = document.getElementById('btn-desktop');
    const onM = () => setVp('mobile');
    const onD = () => setVp('desktop');
    bm.addEventListener('click', onM);
    bd.addEventListener('click', onD);
    return () => { bm.removeEventListener('click', onM); bd.removeEventListener('click', onD); };
  }, []);

  return (
    <div id="stage-el" className={`stage ${vp}`}>
      <FullPage viewport={vp} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
