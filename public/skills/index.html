<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Galgóczy Gergely — skillek és tapasztalat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Sora:wght@300;400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#070d0a; --lime:#C9F26B; --cream:#EFEEDD; --muted:rgba(239,238,221,.6);
    --soft-green:#7FAE90; --line:rgba(201,242,107,.15);
    --font-display:"JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    --font-body:"Sora", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --shadow:0 1px 14px rgba(0,0,0,.65);
    --cardtop:clamp(116px,18vh,168px);
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{margin:0;background:var(--bg);color:var(--cream);font-family:var(--font-body);overflow:hidden;-webkit-font-smoothing:antialiased;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;}

  #flow{position:fixed;inset:0;width:100vw;height:100vh;display:block;z-index:0;transform:translateZ(0);will-change:transform;backface-visibility:hidden;-webkit-backface-visibility:hidden;}

  a.corner{text-decoration:none;}
  .corner{position:fixed;z-index:30;font-family:var(--font-display);font-size:12px;letter-spacing:.14em;text-transform:lowercase;color:var(--muted);user-select:none;text-shadow:var(--shadow);transition:color .25s ease;}
  .corner.tl{top:22px;left:24px;cursor:pointer;}
  .corner.tl:hover{color:var(--lime);}
  .corner .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--lime);margin-right:9px;vertical-align:middle;box-shadow:0 0 10px var(--lime);}

  .langtoggle{position:fixed;top:20px;right:22px;z-index:31;font-family:var(--font-display);font-size:12px;letter-spacing:.12em;}
  .langtoggle .lang{background:none;border:0;color:var(--muted);cursor:pointer;font:inherit;letter-spacing:inherit;padding:3px 5px;transition:color .25s ease;}
  .langtoggle .lang.active{color:var(--lime);}
  .langtoggle .sep{color:var(--muted);opacity:.45;margin:0 1px;}

  .pagetitle{position:fixed;top:clamp(48px,8.5vh,86px);left:50%;transform:translateX(-50%);z-index:24;text-align:center;pointer-events:none;width:92%;}
  .pt-name{font-family:var(--font-display);font-weight:700;font-size:clamp(21px,3.6vw,36px);letter-spacing:.05em;color:var(--cream);text-shadow:0 2px 22px rgba(0,0,0,.7);}
  .pt-name .rch{display:inline-block;animation:ripple 3.4s ease-in-out infinite;}
  @keyframes ripple{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
  .pt-sub{font-family:var(--font-display);font-size:clamp(10px,1.8vw,13px);letter-spacing:.36em;text-transform:lowercase;color:var(--soft-green);margin-top:9px;text-shadow:var(--shadow);}

  .stage{position:fixed;inset:0;z-index:10;display:grid;place-items:center;}
  .orbit{position:relative;}
  #rings{position:absolute;inset:0;overflow:visible;pointer-events:none;}
  #plane{fill:none;stroke:rgba(201,242,107,.12);stroke-width:1;}
  .spoke{stroke:var(--line);stroke-width:1;stroke-dasharray:2 6;transition:stroke .4s ease,stroke-width .4s ease;}
  .spoke.active{stroke:rgba(201,242,107,.5);stroke-width:1.4;}

  .core{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:22;}
  .hub{text-align:center;pointer-events:none;transition:opacity .4s ease;}
  .hub .logohit{display:inline-block;padding:18px;pointer-events:auto;cursor:pointer;touch-action:none;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;transition:transform .18s ease;}
  .hub .logohit:active{transform:scale(.93);}
  /* Static base glow + a compositor-only breathe (transform/opacity).
     Animating drop-shadow filters janks badly in Safari, so the brightness
     swell lives on the canvas centre glow instead (see glowBreath). */
  .hub .logo{display:block;margin:0 auto;width:clamp(44px,7vw,56px);height:auto;opacity:1;pointer-events:none;-webkit-user-drag:none;
    filter:blur(0.8px) drop-shadow(0 0 16px rgba(201,242,107,.55)) drop-shadow(0 0 40px rgba(201,242,107,.3)) drop-shadow(0 0 90px rgba(201,242,107,.18));
    animation:breathe 5s ease-in-out infinite;will-change:transform,opacity;backface-visibility:hidden;}
  @keyframes breathe{
    0%,100%{ transform:scale(1);opacity:.9; }
    50%{ transform:scale(1.07);opacity:1; }
  }
  .hub .invite{margin-top:16px;font-family:var(--font-display);font-size:11.5px;letter-spacing:.16em;color:var(--lime);text-shadow:var(--shadow);}
  body.panel-open .hub{opacity:0;}
  body.panel-open .hub .logohit{pointer-events:none;}

  .card{position:fixed;left:50%;top:var(--cardtop);transform:translateX(-50%) scale(.92);transform-origin:top center;
    opacity:0;filter:blur(10px);pointer-events:none;width:min(440px,90vw);max-height:calc(100dvh - var(--cardtop) - 24px);overflow-y:auto;
    background:#0d1812;border:1px solid rgba(201,242,107,.28);border-radius:20px;padding:36px 34px 32px;
    box-shadow:0 24px 70px rgba(0,0,0,.62), 0 0 30px rgba(201,242,107,.18), 0 0 78px rgba(201,242,107,.09);
    transition:transform .5s cubic-bezier(.16,1,.3,1),opacity .45s ease,filter .5s ease;z-index:32;}
  .card::before{content:"";position:absolute;inset:0;border-radius:20px;padding:1.6px;pointer-events:none;opacity:0;transition:opacity .5s ease;
    background:conic-gradient(from var(--a,0deg), rgba(201,242,107,0) 0deg, rgba(201,242,107,0) 286deg, rgba(201,242,107,.95) 330deg, rgba(201,242,107,0) 360deg);
    -webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite:xor;
    mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); mask-composite:exclude;}
  body.panel-open .card{transform:translateX(-50%) scale(1);opacity:1;filter:blur(0);pointer-events:auto;}
  body.panel-open .card::before{opacity:1;}
  .card .ptag{font-family:var(--font-display);font-size:11px;letter-spacing:.28em;text-transform:lowercase;color:#9CC4AA;}
  .card h2{font-family:var(--font-display);font-weight:700;font-size:clamp(20px,3.4vw,27px);line-height:1.12;letter-spacing:.02em;margin:12px 0 16px;color:#F6F4EC;white-space:pre-line;}
  .card .tagline{font-size:15px;line-height:1.6;color:#F1EFE5;font-weight:300;border-left:2px solid var(--lime);padding-left:15px;margin-bottom:26px;}
  .card .kicker{font-family:var(--font-display);font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:#9CC4AA;margin:0 0 12px;}
  .card ul{list-style:none;margin:0 0 26px;padding:0;}
  .card li{padding:10px 0;border-bottom:1px solid rgba(239,238,221,.12);}
  .card .st-name{display:block;font-family:var(--font-display);font-size:13.5px;font-weight:500;color:var(--lime);letter-spacing:.02em;margin-bottom:3px;}
  .card .st-desc{display:block;font-size:13px;color:#D2D6C9;line-height:1.55;font-weight:300;}
  .tags{display:flex;flex-wrap:wrap;gap:7px;}
  .tag{font-family:var(--font-display);font-size:11.5px;letter-spacing:.03em;color:#F1EFE5;background:rgba(201,242,107,.10);border:1px solid rgba(201,242,107,.3);border-radius:999px;padding:6px 12px;}
  .close{position:absolute;top:18px;right:20px;width:36px;height:36px;border-radius:50%;background:rgba(239,238,221,.06);border:1px solid rgba(239,238,221,.2);color:var(--cream);font-size:17px;cursor:pointer;line-height:1;display:grid;place-items:center;transition:background .2s ease,border-color .2s ease;z-index:1;}
  .close:hover{background:rgba(201,242,107,.16);border-color:var(--lime);}
  .close:focus-visible{outline:2px solid var(--lime);outline-offset:3px;}

  .node{position:absolute;left:0;top:0;transform:translate(-50%,-50%);background:none;border:0;padding:0;cursor:grab;color:inherit;outline:none;width:150px;touch-action:none;-webkit-user-select:none;user-select:none;will-change:transform;}
  .node:active{cursor:grabbing;}
  .node .inner{display:flex;flex-direction:column;align-items:center;gap:9px;}
  .node .ball{width:11px;height:11px;border-radius:50%;background:var(--soft-green);box-shadow:0 0 18px 3px rgba(127,174,144,.62);transition:background .8s ease,box-shadow .8s ease,transform .5s ease;}
  .node .lbl{font-family:var(--font-display);font-size:12.5px;font-weight:500;letter-spacing:.05em;line-height:1.3;text-align:center;color:var(--muted);white-space:pre-line;transition:color .8s ease;text-shadow:var(--shadow);}
  .node:hover .ball,.node:focus-visible .ball,.node.active .ball,.node.spot .ball{background:var(--lime);box-shadow:0 0 33px 9px rgba(201,242,107,.66);transform:scale(1.4);}
  .node:hover .lbl,.node:focus-visible .lbl,.node.active .lbl,.node.spot .lbl{color:var(--cream);}
  .node:focus-visible{outline:2px solid var(--lime);outline-offset:10px;border-radius:14px;}
  body.panel-open .node{pointer-events:none;}

  .backdrop{position:fixed;inset:0;z-index:15;background:rgba(5,10,8,0);pointer-events:none;transition:background .4s ease;}
  body.panel-open .backdrop{background:rgba(5,10,8,.42);pointer-events:auto;}

  .hint{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:30;font-family:var(--font-display);font-size:11px;letter-spacing:.14em;color:var(--muted);text-transform:lowercase;transition:opacity .4s ease;text-align:center;width:92%;text-shadow:var(--shadow);}
  body.panel-open .hint{opacity:0;}

  @media (max-width:700px){ .node{width:108px;} .node .lbl{font-size:11px;} .corner.tl{font-size:10px;} .card{width:94vw;padding:34px 24px 28px;} }
  @media (prefers-reduced-motion: reduce){ .hub .logo{animation:none;} .pt-name .rch{animation:none;} }
</style>
</head>

  const line=document.createElementNS("http://www.w3.org/2000/svg","line");
  line.setAttribute("class","spoke"); svg.appendChild(line); spokes.push(line);
  const btn=document.createElement("button");
  btn.className="node";
  btn.innerHTML='<span class="inner"><span class="ball"></span><span class="lbl"></span></span>';
  btn.addEventListener("pointerdown",e=>onNodeDown(e,i));
  btn.addEventListener("pointermove",onNodeMove);
  btn.addEventListener("pointerup",onNodeUp);
  btn.addEventListener("pointercancel",onNodeUp);
  btn.addEventListener("keydown",e=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); openCard(i); } });
  orbit.appendChild(btn); nodeEls.push(btn);
});

const card=document.getElementById("card"), cbody=document.getElementById("card-body"), backdrop=document.getElementById("backdrop");
function renderCard(d){
  const L=d[LANG], T=STR[LANG];
  let listLabel, listHtml;
  if(L.industries){ listLabel=T.industries; listHtml=L.industries.map(x=>'<li><span class="st-name">'+x+'</span></li>').join(""); }
  else { listLabel=T.milestones; listHtml=L.stations.map(s=>{const n=s[0]?'<span class="st-name">'+s[0]+'</span>':'';return '<li>'+n+'<span class="st-desc">'+s[1]+'</span></li>';}).join(""); }
  const tg=L.skills.map(s=>'<span class="tag">'+s+'</span>').join("");
  cbody.innerHTML='<div class="ptag">'+T.area+'</div><h2 id="card-title">'+L.title+'</h2><p class="tagline">'+L.tagline+'</p><p class="kicker">'+listLabel+'</p><ul>'+listHtml+'</ul><p class="kicker">'+T.skills+'</p><div class="tags">'+tg+'</div>';
}
function openCard(i){open=true;activeI=i;cardA=200;cardAEnd=cardA+360;renderCard(domains[i]);document.body.classList.add("panel-open");card.setAttribute("aria-hidden","false");
  nodeEls.forEach((n,j)=>n.classList.toggle("active",j===i));spokes.forEach((s,j)=>s.classList.toggle("active",j===i));card.scrollTop=0;document.getElementById("close").focus();}
function closeCard(){open=false;activeI=-1;document.body.classList.remove("panel-open");card.setAttribute("aria-hidden","true");
  nodeEls.forEach(n=>n.classList.remove("active"));spokes.forEach(s=>s.classList.remove("active"));}
document.getElementById("close").addEventListener("click",closeCard);
backdrop.addEventListener("click",closeCard);
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeCard();});

function applyLang(l){
  LANG=l; document.documentElement.lang=l; const T=STR[l];
  document.getElementById("pt-sub").textContent=T.sub;
  invite.textContent=T.invite;
  document.getElementById("hint").textContent=T.hint;
  document.getElementById("close").setAttribute("aria-label",T.close);
  document.querySelectorAll(".langtoggle .lang").forEach(b=>b.classList.toggle("active", b.dataset.l===l));
  nodeEls.forEach((n,i)=>{ const lab=domains[i][l].label; n.querySelector(".lbl").textContent=lab; n.setAttribute("aria-label",lab.replace(/\n/g," ")); });
  if(open) renderCard(domains[activeI]);
}
document.querySelectorAll(".langtoggle .lang").forEach(b=>b.addEventListener("click",()=>applyLang(b.dataset.l)));

const logohit=document.getElementById("logohit");
logohit.addEventListener("pointerdown",e=>{ pressing=true; pressPid=e.pointerId; try{logohit.setPointerCapture(e.pointerId);}catch(_){}});
function endPress(e){ pressing=false; pressPid=null; }
logohit.addEventListener("pointerup",endPress);
logohit.addEventListener("pointercancel",endPress);
logohit.addEventListener("contextmenu",e=>e.preventDefault());

function angleOf(e){ const px=e.clientX-cx, py=(e.clientY-cy)/(TILT||1); return Math.atan2(py,px); }
function onNodeDown(e,i){ if(open||introActive) return; dragging=true; grabI=i; moved=false; dragPid=e.pointerId; startX=e.clientX; startY=e.clientY; lastAng=angleOf(e); lastT=performance.now(); vel=0; try{ e.currentTarget.setPointerCapture(e.pointerId); }catch(_){} }
function onNodeMove(e){ if(!dragging||e.pointerId!==dragPid) return; const a=angleOf(e); let d=a-lastAng; if(d>Math.PI)d-=2*Math.PI; if(d<-Math.PI)d+=2*Math.PI; const now=performance.now(), dt=Math.max(1,now-lastT); const inst=d*16.7/dt; vel=vel*0.6+inst*0.4; nodeT+=d; lastAng=a; lastT=now; if(Math.hypot(e.clientX-startX,e.clientY-startY)>6) moved=true; }
function onNodeUp(e){ if(!dragging) return; dragging=false; try{ e.currentTarget.releasePointerCapture(e.pointerId); }catch(_){} if(moved){ omega=Math.max(-0.095,Math.min(0.095, vel)); } else { openCard(grabI); } grabI=-1; }

/* ---------------- perspective vortex disc ---------------- */
const canvas=document.getElementById("flow"), ctx=canvas.getContext("2d",{alpha:false});
const reduced=window.matchMedia("(prefers-reduced-motion: reduce)").matches;
const ACCENT=[[201,242,107],[239,238,221]];
const DARK=["rgba(4,9,7,0.30)","rgba(4,9,7,0.46)","rgba(4,9,7,0.62)","rgba(4,9,7,0.80)"];
let TILT=0.42, DEPTH=0.42;
let dpr=1,cx=0,cy=0,bgGrad=null,R=400,rr=240,S=600,Sc=300,W=0,H=0;
let particles=[], focus=0;

let introActive=!reduced, t0=performance.now(), introT=0, introRot=0, revealMul=reduced?1:0, launched=false;
const LAUNCH=1.0, INTRO_END=3.05, SPRING=0.02, DAMP=0.88;
/* logo-pixel layer for the intro pixelate-explode */
let lp=[], lpReady=false, lpExploded=false;

function makeSprite(c){
  const s=document.createElement("canvas"); s.width=s.height=64; const x=s.getContext("2d");
  const g=x.createRadialGradient(32,32,0,32,32,32);
  g.addColorStop(0,"rgba("+c[0]+","+c[1]+","+c[2]+",1)");
  g.addColorStop(0.35,"rgba("+c[0]+","+c[1]+","+c[2]+",0.5)");
  g.addColorStop(1,"rgba("+c[0]+","+c[1]+","+c[2]+",0)");
  x.fillStyle=g; x.fillRect(0,0,64,64); return s;
}
const SPRITE=[makeSprite(ACCENT[0]),makeSprite(ACCENT[1])];

let dX,dY,dS,dB, sX,sY,sS,sA,sC, gX,gY,gR,gA,gC, dN=0,sN=0,gN=0;
function alloc(n){
  dX=new Float32Array(n);dY=new Float32Array(n);dS=new Float32Array(n);dB=new Uint8Array(n);
  sX=new Float32Array(n);sY=new Float32Array(n);sS=new Float32Array(n);sA=new Float32Array(n);sC=new Uint8Array(n);
  gX=new Float32Array(n);gY=new Float32Array(n);gR=new Float32Array(n);gA=new Float32Array(n);gC=new Uint8Array(n);
}
function makeBg(){
  const g=ctx.createRadialGradient(cx,cy,0,cx,cy,Math.hypot(W,H)*0.62);
  g.addColorStop(0,"#33473a"); g.addColorStop(0.32,"#1d2c23"); g.addColorStop(0.65,"#101b14"); g.addColorStop(1,"#070d0a");
  return g;
}
function sampleLogo(){
  if(!domLogo.naturalWidth) return;
  const lh=Math.min(Math.max(Math.min(W,H)*0.16,72),150);
  const ar=domLogo.naturalWidth/domLogo.naturalHeight, sh=lh, sw=sh*ar, CELL=5;
  const cols=Math.max(1,Math.round(sw/CELL)), rows=Math.max(1,Math.round(sh/CELL));
  const tc=document.createElement("canvas"); tc.width=cols; tc.height=rows;
  const tx=tc.getContext("2d"); tx.drawImage(domLogo,0,0,cols,rows);
  const d=tx.getImageData(0,0,cols,rows).data; lp=[];
  for(let j=0;j<rows;j++) for(let i=0;i<cols;i++){
    if(d[(j*cols+i)*4+3]>60){ lp.push({ox:(i+0.5)*CELL-sw/2, oy:(j+0.5)*CELL-sh/2, x:0,y:0,vx:0,vy:0, ci:(Math.random()<0.16?0:1)}); }
  }
  if(lp.length>820){ const step=Math.ceil(lp.length/820); lp=lp.filter((_,k)=>k%step===0); }
  lpReady=lp.length>0; lpExploded=false;
}
function layout(){
  W=window.innerWidth; H=window.innerHeight;
  S=Math.max(280,Math.min(Math.min(W,H)*0.86,760)); Sc=S/2;
  orbit.style.width=orbit.style.height=S+"px";
  svg.setAttribute("viewBox","0 0 "+S+" "+S); svg.setAttribute("width",S); svg.setAttribute("height",S);
}
function setSize(){
  const mob = W<700;
  TILT = mob?0.66:0.42; DEPTH = mob?0.30:0.42;
  dpr=Math.min(window.devicePixelRatio||1,1.5);
  canvas.width=W*dpr; canvas.height=H*dpr; ctx.setTransform(dpr,0,0,dpr,0,0);
  cx=W/2; cy=H/2;
  R = mob ? Math.min(W*0.96, H*0.52) : Math.min(W*0.60, H*0.96);
  rr = mob ? Math.min(R*0.62, W*0.38, H*0.34) : Math.min(R*0.58, W*0.32, H*0.46);
  bgGrad=makeBg();
  plane.setAttribute("cx",Sc); plane.setAttribute("cy",Sc); plane.setAttribute("rx",rr); plane.setAttribute("ry",rr*TILT);
  initParticles();
}
function spawn(p,rim){
  p.theta=Math.random()*Math.PI*2;
  p.r= rim ? R*(0.86+Math.random()*0.16) : R*(0.05+Math.random()*0.95);
  p.avk=0.8+Math.random()*0.5;
  p.inw=0.0006+Math.random()*0.0010;
  p.yoff=(Math.random()-0.5)*R*0.07;
  const r1=Math.random();
  if(r1<0.94){ p.kind=0; p.size=0.8+Math.random()*1.4; }
  else if(r1<0.984){ p.kind=1; p.size=0.9+Math.random()*1.3; p.alpha=0.5+Math.random()*0.4; p.ci=Math.random()<0.6?0:1; }
  else { p.kind=2; p.size=1.0+Math.random()*1.8; p.ci=Math.random()<0.72?0:1; p.ph=Math.random()*6.283; }
  return p;
}
function initParticles(){
  const cap=W<700?7000:30000;
  const n=Math.round(Math.min(Math.max((W*H)/645,2800),cap));
  particles=[]; for(let k=0;k<n;k++){ const p=spawn({},false); p.tr=p.r; p.rv=0; particles.push(p); }
  alloc(n);
}

let K=0.003024;  /* vortex rotation speed (×0.72 vs base → another 10% slower; scales normal + press-boost) */
function emit(p){
  const wx=p.r*Math.cos(p.theta), wz=p.r*Math.sin(p.theta), f=wz/R;
  const persp=1+f*DEPTH;
  const sx=cx+wx*persp, sy=cy+(wz*TILT+p.yoff)*persp;
  if(sx<-18||sx>W+18||sy<-18||sy>H+18) return;
  const sz=Math.max(0.4,p.size*persp);
  if(p.kind===0){ let b=((f+1)*2)|0; if(b>3)b=3; if(b<0)b=0; dX[dN]=sx;dY[dN]=sy;dS[dN]=sz;dB[dN]=b;dN++; }
  else if(p.kind===1){ sX[sN]=sx;sY[sN]=sy;sS[sN]=sz*1.15;sA[sN]=(0.5+(f+1)*0.3)*0.9;sC[sN]=p.ci;sN++; }
  else { const ad=0.5+(f+1)*0.25, pulse=0.55+0.45*Math.sin(pulseT+p.ph); gX[gN]=sx;gY[gN]=sy;gR[gN]=(6+p.size*3.5)*persp;gA[gN]=Math.min(ad*pulse,1)*0.9;gC[gN]=p.ci;gN++; }
}
function project(mode){
  dN=0; sN=0; gN=0;
  if(mode===2){
    if(introT<LAUNCH) return;
    for(const p of particles){
      p.theta += (K/(p.r/R+0.18))*p.avk*introRot*fr;
      p.rv += (p.tr - p.r)*SPRING; p.rv *= DAMP; p.r += p.rv;
      emit(p);
    }
    return;
  }
  const speedMul=(1+focus*0.35)*(1+boost*2);
  for(const p of particles){
    if(mode===1){ const rN=p.r/R; p.theta += (K/(rN+0.18))*p.avk*speedMul*fr; p.r -= R*(p.inw*(1+(1-rN)*2.2 + focus*1.5))*fr; if(p.r<R*0.035){ spawn(p,true); p.tr=p.r; } }
    emit(p);
  }
}
function paint(){
  ctx.globalCompositeOperation="source-over"; ctx.globalAlpha=1; ctx.fillStyle=bgGrad; ctx.fillRect(0,0,W,H);
  for(let b=0;b<4;b++){ ctx.beginPath(); for(let k=0;k<dN;k++){ if(dB[k]===b) ctx.rect(dX[k],dY[k],dS[k],dS[k]); } ctx.fillStyle=DARK[b]; ctx.fill(); }
  ctx.globalCompositeOperation="lighter";
  for(let k=0;k<sN;k++){ const c=ACCENT[sC[k]]; ctx.fillStyle="rgba("+c[0]+","+c[1]+","+c[2]+","+Math.min(sA[k],1)+")"; ctx.fillRect(sX[k],sY[k],sS[k],sS[k]); }
  for(let k=0;k<gN;k++){ const r=gR[k]; ctx.globalAlpha=Math.min(gA[k],1); ctx.drawImage(SPRITE[gC[k]], gX[k]-r, gY[k]-r, r*2, r*2); }
  ctx.globalAlpha=1;
  ctx.save(); ctx.translate(cx,cy); ctx.scale(1, TILT+0.35);
  const eg=ctx.createRadialGradient(0,0,0,0,0,R*0.5);
  eg.addColorStop(0,"rgba(201,242,107,"+(0.05+focus*0.13+glowBreath*0.10)+")"); eg.addColorStop(1,"rgba(201,242,107,0)");
  ctx.fillStyle=eg; ctx.fillRect(-W,-H,W*2,H*2); ctx.restore();
}
function drawLP(alpha){
  ctx.globalCompositeOperation="lighter"; ctx.globalAlpha=alpha;
  for(const q of lp){
    if(lpExploded){ q.x+=q.vx; q.y+=q.vy; q.vx*=0.965; q.vy*=0.965; }
    const x=cx+q.ox+q.x, y=cy+q.oy+q.y;
    ctx.fillStyle = q.ci ? "rgb(201,242,107)" : "rgb(239,238,221)";
    ctx.fillRect(x-2.4, y-2.4, 4.8, 4.8);
  }
  ctx.globalAlpha=1;
}
function placeNodes(){
  for(let i=0;i<4;i++){
    const a=BASE_ANG[i]+nodeT, ct=Math.cos(a), st=Math.sin(a), f=st;
    const persp=1+f*0.22;
    const x=Sc+rr*ct*persp, y=Sc+rr*st*TILT*persp;
    const n=nodeEls[i];
    n.style.transform="translate("+x+"px,"+y+"px) translate(-50%,-50%) scale("+persp.toFixed(3)+")";
    let baseOp = open ? (i===activeI?0.75:0.28) : (i===curSpot?1:(0.5+(f+1)*0.25));
    n.style.opacity=(baseOp*revealMul).toFixed(3);
    n.style.zIndex = 10+Math.round((f+1)*7);
    spokes[i].setAttribute("x1",Sc); spokes[i].setAttribute("y1",Sc); spokes[i].setAttribute("x2",x); spokes[i].setAttribute("y2",y);
  }
}
function eo(t){ return 1-(1-t)*(1-t); }
function step(){
  const now=performance.now();
  /* Frame ratio vs a 60fps baseline → motion speed stays identical across
     refresh rates (60Hz / 120Hz ProMotion) and browser warm-up. Without this
     the fixed per-frame steps run ~2× fast on 120Hz (Chrome) and slow while
     Safari ramps from 60→120Hz on load. */
  let dt=now-lastNow; lastNow=now; fr=dt/16.667; if(fr>3) fr=1; else if(fr<0.1) fr=0.1;
  pulseT=now*0.004;
  glowBreath=0.5+0.5*Math.sin(now*0.0013);   /* ~4.8s breathe for the centre glow */
  focus += ((open?1:0)-focus)*0.05*fr;
  boost += ((pressing?1:0)-boost)*(pressing?0.022:0.10)*fr;
  /* edge light sweeps exactly twice (720°) on open, then rests */
  if(open && cardA<cardAEnd){ cardA+=2.4*fr; card.style.setProperty("--a", cardA+"deg"); }

  if(introActive){
    introT=(now-t0)/1000;
    if(introT>INTRO_END){ introActive=false; hub.style.opacity=""; hub.style.transform=""; invite.style.opacity=""; svg.style.opacity=""; revealMul=1; lp=[]; kickCompositor(); }
    else {
      introRot = Math.max(0, Math.min(1, (introT-1.15)/1.25));
      if(introT>=LAUNCH && !launched){ launched=true; for(const p of particles){ p.r=0.0001; p.rv=R*0.055*(0.4+Math.random()*0.95); } }
      if(introT>=0.9 && !lpExploded && lpReady){ lpExploded=true; const minD=Math.min(W,H); for(const q of lp){ const ang=Math.atan2(q.oy,q.ox)+(Math.random()-0.5)*0.85; const sp=minD*0.007*(0.5+Math.random()*1.25); q.vx=Math.cos(ang)*sp; q.vy=Math.sin(ang)*sp-Math.random()*minD*0.0018; } }
      let hubO, hubScale;
      if(introT<0.5){ const t=introT/0.5; hubO=eo(t); hubScale=0.6+0.45*eo(t); }
      else if(introT<0.9){ const t=(introT-0.5)/0.4; hubO=1-t; hubScale=1.05+0.07*t; }
      else if(introT<2.3){ hubO=0; hubScale=1.12; }
      else if(introT<2.85){ const t=(introT-2.3)/0.55; hubO=eo(t); hubScale=0.85+0.15*eo(t); }
      else { hubO=1; hubScale=1; }
      hub.style.opacity=hubO.toFixed(3); hub.style.transform="scale("+hubScale.toFixed(3)+")";
      revealMul = Math.max(0, Math.min(1, (introT-2.4)/0.65));
      invite.style.opacity=revealMul.toFixed(3);
      svg.style.opacity=revealMul.toFixed(3);
      let lpA=0;
      if(introT>=0.5 && introT<0.9) lpA=(introT-0.5)/0.4;
      else if(introT>=0.9 && introT<1.9) lpA=1-(introT-0.9)/1.0;
      project(2); paint(); if(lpReady && lpA>0.01) drawLP(lpA); placeNodes();
      return;
    }
  }

  if(!open && !dragging){ nodeT += omega*fr; omega += (BASE_OMEGA-omega)*0.02*fr; }
  let spotTarget=-1;
  if(!open && !dragging){ const cyc=5200; const i=Math.floor(now/cyc)%4; if((now%cyc)<3200) spotTarget=i; }
  if(spotTarget!==curSpot){ curSpot=spotTarget; nodeEls.forEach((n,j)=>n.classList.toggle("spot", j===curSpot)); }
  project(1); paint(); placeNodes();
}
function drawStatic(){ project(0); paint(); placeNodes(); }
/* iOS WebKit sometimes won't promote the full-screen canvas to its own GPU
   layer until the layer tree is rebuilt — opening/closing a card does exactly
   that, which is why the animation only turns smooth after a card cycle.
   Insert + remove a transparent, masked, composited overlay to force the same
   rebuild on load, invisibly. */
function kickCompositor(){
  try{
    const k=document.createElement("div");
    k.setAttribute("aria-hidden","true");
    k.style.cssText="position:fixed;inset:0;z-index:99;pointer-events:none;opacity:0;transform:translateZ(0);will-change:transform;-webkit-mask:linear-gradient(#000 0 0);mask:linear-gradient(#000 0 0);";
    document.body.appendChild(k);
    void k.offsetHeight;
    requestAnimationFrame(()=>requestAnimationFrame(()=>{ try{ k.remove(); }catch(_){ } }));
  }catch(_){ }
}
let raf=null,running=false;
function loop(){step();raf=requestAnimationFrame(loop);}
function start(){if(running)return;running=true;loop();}
function stop(){running=false;if(raf)cancelAnimationFrame(raf);raf=null;}
document.addEventListener("visibilitychange",()=>{document.hidden?stop():(reduced&&!introActive?null:start());});
function boot(){ layout(); setSize(); applyLang("hu"); sampleLogo(); t0=performance.now(); if(reduced){ drawStatic(); } else { start(); requestAnimationFrame(()=>requestAnimationFrame(kickCompositor)); } }
window.addEventListener("resize",()=>{layout();setSize();if(reduced&&!introActive)drawStatic();});
if(domLogo.complete && domLogo.naturalWidth){ boot(); } else { domLogo.addEventListener("load", boot, {once:true}); setTimeout(()=>{ if(!running) boot(); }, 1200); }
</script>
</body>
