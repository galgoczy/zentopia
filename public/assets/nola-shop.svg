<?xml version="1.0" encoding="UTF-8"?>
<!--
  Zentopia · Nola and Co — case study visual.
  Shopping-cart silhouette with a receipt/screen panel inside (product rows + dots).
  Violet stroke on transparent background. ViewBox 200×160.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 160" width="400" height="320">
  <g fill="none" stroke="#A289FF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Cart handle + frame outline -->
    <polyline points="40,40 60,40 70,108 160,108" stroke-width="2"/>
    <!-- Wheels -->
    <circle cx="86" cy="124" r="6"/>
    <circle cx="146" cy="124" r="6"/>
    <!-- Receipt / screen panel -->
    <rect x="70" y="56" width="100" height="42"/>
    <line x1="80" y1="72" x2="120" y2="72"/>
    <line x1="80" y1="84" x2="140" y2="84"/>
    <!-- Terminal dots -->
    <circle cx="160" cy="56" r="3" fill="#A289FF" stroke="none"/>
    <circle cx="120" cy="72" r="2" fill="#A289FF" stroke="none"/>
    <circle cx="140" cy="84" r="2" fill="#A289FF" stroke="none"/>
  </g>
</svg>
